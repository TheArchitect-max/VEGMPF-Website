<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="t d">
  <title id="t">Viola multimodal perception field</title>
  <desc id="d">Abstract conceptual visualization of multiple perception channels converging through a governed interpretation field.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="58%">
      <stop offset="0" stop-color="#2b2036" stop-opacity=".94"/>
      <stop offset=".48" stop-color="#15111b" stop-opacity=".72"/>
      <stop offset="1" stop-color="#09080c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="34%" r="64%">
      <stop offset="0" stop-color="#dac8ff"/>
      <stop offset=".24" stop-color="#a083cc"/>
      <stop offset=".58" stop-color="#503869"/>
      <stop offset="1" stop-color="#17101f"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <circle cx="380" cy="380" r="355" fill="url(#bg)"/>

